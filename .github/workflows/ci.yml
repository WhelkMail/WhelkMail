name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A personal deployment config must never reach the public repository:
      # it carries the Pages URL and account-scoped resource identifiers.
      - name: No personal config
        run: |
          tracked=$(git ls-files -- 'wrangler.toml' 'worker/wrangler.toml' '.dev.vars' '.dev.vars.*')
          if [ -n "$tracked" ]; then
            echo "These files must stay untracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
